rules:
  - id: require-metrics
    desc: Metrics file must exist and be fresh (<24h)
    check:
      file_exists: ".helix/metrics.json"
      max_age_hours: 24

  - id: require-health-main
    desc: On main, health must be >=85
    check:
      file_exists: ".helix/health.json"
      min_health: 85
      branch: "main"

  - id: evolution-baseline
    desc: Evaluation plans + ROADMAP + TASKS must exist (guarded)
    check:
      run: "bash scripts/evolution-guard.sh"

  - id: non-empty-tasks
    desc: Tasks must not be empty when decision.action=harden
    check:
      run: "grep -q '\\[ \\]' docs/TASKS.md"
